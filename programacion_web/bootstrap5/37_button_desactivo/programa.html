<!doctype html>
<html>
<head>
  <title>Prueba de Bootstrap 5</title> 
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
</head>
<body>
  
  <div class="container">
    <form>
       <button type="submit" class="btn btn-primary btn-lg">Botón activo</button>       
       <button type="submit" class="btn btn-primary btn-lg" disabled="disabled">Botón 1 desactivo</button>       
       <button type="submit" class="btn btn-primary btn-lg" disabled="disabled">Botón 2 desactivo</button>       
       <button type="submit" class="btn btn-primary btn-lg" disabled="disabled">Botón 3 desactivo</button>       
    </form>
  </div> 

</body>
</html>
