<!--
  Definir para el elemento <h6> el mismo tamaño de fuente (12px) que el elemento <p> (párrafo) pero color azul para el título y gris claro (color:#aaaaaa) para el párrafo. Agrupar las dos elementos para la definición de la fuente y posteriormente agregar a cada elemento el valor respectivo para el color del texto.
-->

<!DOCTYPE html>
<html>
<head>
  <title>Problema</title>
  <meta charset="UTF-8">

<style>
h6,p {
  font-size:12;
}
h6 {
  color:#0000ff;
}
p {
  color:#aaaaaa;
}
</style>

</head>
<body>
<h6>Título de nivel 6</h6>
<p>Esto es un párrafo.</p>
</body>
</html>
