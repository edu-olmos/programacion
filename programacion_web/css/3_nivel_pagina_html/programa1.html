<!--
  Podemos definir estilos para muchos elementos en la sección style:
-->

<!DOCTYPE html>
<html>
<head>
  <title>Problema</title>
  <meta charset="UTF-8">
<style>
  h1 {color:#ff0000}
  h2 {color:#00ff00}
  h3 {color:#0000ff}
</style>
</head>
<body>
<h1>rojo</h1>
<h2>verde</h2>
<h3>azul</h3>
</body>
</html>
