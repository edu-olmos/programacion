<!--
  Crear una página HTML y definir tres títulos empleando los elemento h1, h2 y h3. Definir el mismo color para el texto de cada bloque y colores diferentes para el fondo de los mismos (cada elemento HTML debe tener definida la propiedad style) 
-->

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pruebas de CSS</title>
</head>
<body>

<h1 style="color:#000000;background-color:#ff0000">
Titulo de Nivel 1.
</h1>
<h1 style="color:#000000;background-color:#00ff00">
Titulo de Nivel 2.
</h1>
<h1 style="color:#000000;background-color:#0000ff">
Titulo de Nivel 3.
</h1>

</body>
</html>
