<!--
    Confeccionar una función que reciba un conjunto variable de enteros y nos retorne su suma:
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        function sumar() {
            let s = 0;
            for (let f = 0; f < arguments.length; f++) {
                s = s + arguments[f];
            }
            return s;
        }

        document.write(sumar(2, 4));
        document.write('<br>');
        document.write(sumar(1, 2, 3, 4, 5));
        document.write('<br>');
        document.write(sumar(100, 200, 300));
    </script>

</body>

</html>
