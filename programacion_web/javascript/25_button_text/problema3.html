<!--
    Cargar un nombre y un apellido en sendos text. Al presionar un botón, concatenarlos y mostrarlos en un tercer text (Tener en cuenta que podemos modificar la propiedad value de un objeto TEXT cuando ocurre un evento) 
-->
<!--
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <form>
        <p>Ingrese su nombre:<input type="text" id="nombre"></p>
        <p>Ingrese su apellido:<input type="text" id="apellido"></p>
        <p><input type="button" value="Confirmar" onClick="mostrar()"></p>
    </form>

    <script>
        function mostrar() {
            let nom = document.getElementById('nombre').value;
            let ape = document.getElementById('apellido').value;
            let completo = nom + ' ' + ape;
            alert('Nombre completo: ' + completo);
        }
    </script>

</body>

</html>
