<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        function calcularPerimetro(lado) {
            let per = lado * 4;
            return per;
        }

        let l = parseInt(prompt('Ingrese valor del lado:'));
        document.write(calcularPerimetro(l));
    </script>

</body>

</html>
