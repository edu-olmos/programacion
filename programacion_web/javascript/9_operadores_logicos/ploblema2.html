<!--
    Se ingresan tres valores por teclado, si todos son iguales se imprime la suma del primero con el segundo y a este resultado se lo multiplica por el tercero (tener en cuenta que puede haber tres condiciones simples) 
-->

<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Documento</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>
<body>
<script>
    let num1 = parseInt(prompt("Ingrese el primer número:"));
    let num2 = parseInt(prompt("Ingrese el segundo número:"));
    let num3 = parseInt(prompt("Ingrese el tercer número:"));

    if (num1 === num2 && num2 === num3) {
        let suma = num1 + num2;
        let resultado = suma * num3;
        alert("La suma de " + num1 + " y " + num2 + " multiplicada por " + num3 + " es: " + resultado);
    } else {
        alert("Los números no son iguales.");
    }
</script>

</body>
</html>
