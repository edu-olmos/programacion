<!--
    Realizar un programa que pida la carga de dos vectores numéricos. Obtener la suma de los dos vectores, dicho resultado guardarlo en un tercer vector del mismo tamaño. Sumar componente a componente.
El tamaño del vector es a elección. 
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        function cargar(elementos) {
            for (let f = 0; f < elementos.length; f++) {
                let v = prompt('Ingrese un número:');
                elementos[f] = parseInt(v);
            }
        }

        function sumarVectores(vec1, vec2, resultado) {
            for (let f = 0; f < vec1.length; f++) {
                resultado[f] = vec1[f] + vec2[f];
            }
        }

        function mostrarVector(vec, nombre) {
            document.write(nombre + ': ');
            for (let f = 0; f < vec.length; f++) {
                document.write(vec[f] + ' ');
            }
            document.write('<br>');
        }

        let tamaño = 5;
        let vector1 = new Array(tamaño);
        let vector2 = new Array(tamaño);
        let resultado = new Array(tamaño);

        cargar(vector1);
        cargar(vector2);
        sumarVectores(vector1, vector2, resultado);
        mostrarVector(vector1, 'Vector 1');
        mostrarVector(vector2, 'Vector 2');
        mostrarVector(resultado, 'Resultado (Suma de Vector 1 y Vector 2)');
    </script>
</body>

</html>
