<!--
    El método replace realiza una búsqueda y reemplazo
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        let oracion = 'uno dos tres uno dos tres uno dos tres';
        let cadena = oracion.replace(/uno/g, '1');
        alert(cadena); //1 dos tres 1 dos tres 1 dos tres
    </script>

</body>

</html>
