<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        let vec = [10, 20, 30, 40, 50];
        vec.forEach(function(componente, indice) {
            document.write('Posición:' + indice + ' = ');
            document.write(componente + '<br>');
        })
    </script>

</body>

</html>
