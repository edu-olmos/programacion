<!--
    Desarrollar un programa que muestre la tabla de multiplicar del 5 (del 5 al 50). 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Title</title>
</head>
<body>
    <script>
        document.write("<h3>Tabla de multiplicar del 5</h3>");
        for (let i = 1; i <= 10; i++) {
            let resultado = 5 * i;
            document.write("<p>5 x " + i + " = " + resultado + "</p>");
        }
    </script>

    <footer>
        <small>&copy; Ing Eduardo 2026</small>
    </footer>
</body>
</html>
