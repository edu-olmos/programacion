<!--
    Realizar un programa que lea los lados de 4 triángulos, e informar:
a) De cada uno de ellos, qué tipo de triángulo es: equilátero (tres lados iguales), isósceles (dos lados iguales), o escaleno (ningún lado igual)
b) Cantidad de triángulos de cada tipo.
c) Tipo de triángulo del que hay menor cantidad. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Title</title>
</head>
<body>
    <script>
        let contadorEquilatero = 0;
        let contadorIsosceles = 0;
        let contadorEscaleno = 0;

        for (let i = 1; i <= 4; i++) {
            let lado1 = parseFloat(prompt("Ingrese el lado 1 del triángulo " + i + ":"));
            let lado2 = parseFloat(prompt("Ingrese el lado 2 del triángulo " + i + ":"));
            let lado3 = parseFloat(prompt("Ingrese el lado 3 del triángulo " + i + ":"));

            let tipoTriangulo = "";

            if (lado1 === lado2 && lado2 === lado3) {
                tipoTriangulo = "Equilátero";
                contadorEquilatero++;
            } else if (lado1 === lado2 || lado1 === lado3 || lado2 === lado3) {
                tipoTriangulo = "Isósceles";
                contadorIsosceles++;
            } else {
                tipoTriangulo = "Escaleno";
                contadorEscaleno++;
            }

            document.write("<h3>Triángulo " + i + "</h3>");
            document.write("<p>Tipo: " + tipoTriangulo + "</p>");
        }

        document.write("<h3>Cantidad de triángulos por tipo:</h3>");
        document.write("<p>Equiláteros: " + contadorEquilatero + "</p>");
        document.write("<p>Isósceles: " + contadorIsosceles + "</p>");
        document.write("<p>Escalenos: " + contadorEscaleno + "</p>");

        let menorCantidad = Math.min(contadorEquilatero, contadorIsosceles, contadorEscaleno);
        let tipoMenorCantidad = "";

        if (menorCantidad === contadorEquilatero) {
            tipoMenorCantidad += "Equilátero ";
        }
        if (menorCantidad === contadorIsosceles) {
            tipoMenorCantidad += "Isósceles ";
        }
        if (menorCantidad === contadorEscaleno) {
            tipoMenorCantidad += "Escaleno ";
        }

        document.write("<h3>Tipo de triángulo con menor cantidad: " + tipoMenorCantidad.trim() + "</h3>");
    </script>

    <footer>
        <small>&copy; Ing Eduardo 2026</small>
    </footer>
</body>
</html>
