<!--
    Se ingresan un conjunto de 5 alturas de personas por teclado. Mostrar la altura promedio de las personas.
-->

<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plantilla básica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mi sitio</h1>
    </header>

    <script>
        let x = 1;
        let suma = 0;
        let valor;
        while (x <= 5) {
            valor = parseFloat(prompt('Ingrese la altura de la persona ' + x + ':'));
            suma = suma + valor;
            x = x + 1;
        }
        let promedio = suma / 5;
        document.write('La altura promedio es ' + promedio.toFixed(2) + '<br>');
    </script>

    <footer>
        <small>© Ing Eduardo 2026</small>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
