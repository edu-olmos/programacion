<!--
    Podemos crear un Map vacío y posteriormente añadir elementos al mapa mediante el método 'set':
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>
    <script>
        const mapa1 = new Map();
        mapa1.set("casa", "house");
        mapa1.set("rojo", "red");
        mapa1.set("auto", "car");
        console.log(mapa1);
    </script>
</body>

</html>
