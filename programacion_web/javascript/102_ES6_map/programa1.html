

<!--
   Podemos crear un Map e inmediatamente pasar los datos iniciales en el constructor del mismo:
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>
    <script>
        const mapa1 = new Map([
            ["casa", "house"],
            ["rojo", "red"],
            ["auto", "car"]
        ]);
        console.log(mapa1);
    </script>
</body>

</html>
