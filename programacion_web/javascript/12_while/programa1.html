<!--
     Imprimir los números del -50 al 0.
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        var numero = -50;

        while (numero <= 0) {
            document.write(numero + "<br>");
            numero++;
        }
    </script>

</body>

</html>
