<!--
     Imprimir los números del 2 al 100 pero de 2 en 2 (2,4,6,8 ....100).
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        let numero = 2;

        while (numero <= 100) {
            document.write(numero + "<br>");
            numero += 2;
        }
    </script>

</body>

</html>
