<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
    let vec=[10,20,30,40,50,60];
    let vec2=vec.slice(2); // vec2 almacena [30,40,50,60]
    document.write('Vector original<br>');
    for (let f=0;f<vec.length;f++) {
        document.write(vec[f]+'-');
    }
    document.write('<br>');
    document.write('Vector resultante de la llamada a slice<br>');
    for (let f=0;f<vec2.length;f++) {
        document.write(vec2[f]+'-');
    }

    let vec3=[10,20,30,40,50,60];
    let vec4=vec.slice(-2); // vec2 almacena [50,60]
    document.write('<br><br>Vector original<br>');
    for (let f=0;f<vec3.length;f++) {
        document.write(vec3[f]+'-');
    }
    document.write('<br>');
    document.write('Vector resultante de la llamada a slice con índice negativo<br>');
    for (let f=0;f<vec4.length;f++) {
        document.write(vec4[f]+'-');
    }

    let vec5=[10,20,30,40,50,60];
    let vec6=vec.slice(-3,-1); // vec2 almacena [40,50] 
    document.write('<br><br>Vector original<br>');
    for (let f=0;f<vec5.length;f++) {
        document.write(vec5[f]+'-');
    }
    document.write('<br>');
    document.write('Vector resultante de la llamada a slice con índices negativos<br>');
    for (let f=0;f<vec6.length;f++) {
        document.write(vec6[f]+'-');
    }
    let vec7=[10,20,30,40,50,60];
    let vec8=vec.slice(1,-1); // vec2 almacena [20,30,40,50]
    document.write('<br><br>Vector original<br>');
    for (let f=0;f<vec7.length;f++) {       
        document.write(vec7[f]+'-');
    }
    document.write('<br>');
    document.write('Vector resultante de la llamada a slice con índices positivo y negativo<br>');
    for (let f=0;f<vec8.length;f++) {   
        document.write(vec8[f]+'-');
    }
    </script>   
</body>
</html>
