<!--
    Se ingresan tres notas de un alumno, si el promedio es mayor o igual a 4 mostrar un mensaje 'regular', sino 'reprobado'. 
-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Problema2</title>
    <meta name="description" content="Plantilla simple HTML">
    <style>
        :root{--bg:#fff;--fg:#111;--accent:#0078d4}
        body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;background:var(--bg);color:var(--fg);line-height:1.4}
        header,footer{padding:1rem;background:#f5f5f5}
        main{padding:1rem}
        .container{max-width:900px;margin:0 auto}
        a{color:var(--accent);text-decoration:none}
    </style>
</head>
<body>
    
    <main>
        <div class="container">
            <h2>Bienvenido</h2>
            <p>Esta es una plantilla HTML5 mínima para empezar.</p>
        </div>
    </main>
    <script>
        let nota1, nota2, nota3;
        nota1 = parseFloat(prompt('Ingrese la primera nota:'));
        nota2 = parseFloat(prompt('Ingrese la segunda nota:'));
        nota3 = parseFloat(prompt('Ingrese la tercera nota:'));
        let promedio = (nota1 + nota2 + nota3) / 3;
        if (promedio >= 4) {
            document.write('Regular');
        } else {
            document.write('Reprobado');
        }
    </script>

    <footer>
        <div class="container">
            <small>© Ing Eduardo 2026</small>
        </div>
    </footer>

    <script>
        // Código JS opcional
        (function(){console.log('Plantilla cargada')})();
    </script>
</body>
</html>
