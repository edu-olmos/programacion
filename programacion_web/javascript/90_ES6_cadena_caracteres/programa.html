<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        const valor1 = parseInt(prompt('Ingrese primer valor:'));
        const valor2 = parseInt(prompt('Ingrese segundo valor:'));
        document.write(`La suma de ${valor1} y ${valor2} es ${valor1+valor2}`);
    </script>

</body>

</html>
