<!--
    Realizar un programa que muestre en un div el número 2. Cada vez que se hace doble clic sobre el mismo duplicar el valor contenido en el div. 
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>
    <div id="numero">2</div>

    <script>
        document.getElementById('numero').addEventListener('dblclick', duplicar);

        function duplicar() {
            let valor = document.getElementById('numero').innerHTML;
            valor = parseInt(valor);
            let resultado = valor * 2;
            document.getElementById('numero').innerHTML = resultado;
        }
    </script>
