<!--
     Confeccionar una función que solicite la carga de 5 valores por teclado y retorne su suma 
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>

        function retornarSuma(a, b, c, d, e) {
            return a + b + c + d + e;
        }

        let valor1 = parseInt(prompt("Ingrese el primer valor "));
        let valor2 = parseInt(prompt("Ingrese el segundo valor "));
        let valor3 = parseInt(prompt("Ingrese el tercer valor "));
        let valor4 = parseInt(prompt("Ingrese el cuarto valor "));
        let valor5 = parseInt(prompt("Ingrese el quinto valor "));
        let m = retornarSuma(valor1, valor2, valor3, valor4, valor5);
        document.write('la suma es: ' + m);
    </script>

</body>

</html>
