<!--
    Desarrollar una función que retorne la cantidad de dígitos que tiene una variable entera positiva de hasta 5 dígitos. 
-->

<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>

        function cantidadDigitos(valor) {
            if (valor < 10) {
                return 1;
            } else if (valor < 100) {
                return 2;
            } else if (valor < 1000) {
                return 3;
            } else if (valor < 10000) {
                return 4;
            } else {
                return 5;
            }
        }

        let valor = parseInt(prompt("Ingrese el valor ")); 
        let m = cantidadDigitos(valor);
        document.write('la cantidad de digitos es: ' + m);
    </script>

</body>

</html>
