<!--
  Dibujar 250 cuadraditos (50 por línea) Los colores de los cuadrados deben empezar en negro y avanzar hasta el rojo.
-->

<!DOCTYPE HTML>
<html>
<head>
  <title>Título de la página</title>
  <meta charset="UTF-8">

<script type="text/javascript">
function retornarLienzo(x) {
  var canvas = document.getElementById(x);
  if (canvas.getContext) {
    var lienzo = canvas.getContext("2d");   
    return lienzo;
  } else
    return false;
}

function dibujar() {
  var lienzo=retornarLienzo("lienzo1");
  if (lienzo) {
    var rojo=0;
    for(var fil=1;fil<=5;fil++) {
      for(var col=1;col<=50;col++) {  
        lienzo.fillStyle="rgb("+rojo+",0,0)";
        lienzo.fillRect(col*15,fil*15,14,14);
        rojo++;
      }
    }      
  }
}
</script>

</head>
<body onLoad="dibujar()">
<canvas id="lienzo1" width="750" height="300">
Su navegador no permite utilizar canvas.
</canvas>
</body>
</html>
