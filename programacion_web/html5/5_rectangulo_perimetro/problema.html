<!--
  Dibujar tres cuadrados de color rojo, verde y azul.
-->

<!DOCTYPE HTML>
<head>
  <title>Título de la página</title>
  <meta charset="UTF-8">

<script type="text/javascript">
function retornarLienzo(x) {
  var canvas = document.getElementById(x);
  if (canvas.getContext) {
    var lienzo = canvas.getContext("2d");   
    return lienzo;
  } else
    return false;
}

function dibujar() {
  var lienzo=retornarLienzo("lienzo1");
  if (lienzo) { 
    lienzo.strokeStyle="rgb(255,0,0)";
    lienzo.strokeRect(10,10,50,50);
    lienzo.strokeStyle="rgb(0,255,0)";
    lienzo.strokeRect(70,10,50,50);
    lienzo.strokeStyle="rgb(0,0,255)";
    lienzo.strokeRect(130,10,50,50);
  }
}
</script>

</head>
<body onLoad="dibujar()">
<canvas id="lienzo1" width="300" height="300">
Su navegador no permite utilizar canvas.
</canvas>
</body>
</html>
