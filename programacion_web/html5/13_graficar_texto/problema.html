<!--
  Mostrar la fecha actual en la parte superior del canvas centrado.
-->

<!DOCTYPE HTML>
<html>
<head>
  <title>Título de la página</title>
  <meta charset="UTF-8">

<script type="text/javascript">
function retornarLienzo(x) {
  var canvas = document.getElementById(x);
  if (canvas.getContext) {
    var lienzo = canvas.getContext("2d");   
    return lienzo;
  } else
    return false;
}

function dibujar() {
  var lienzo=retornarLienzo("lienzo1");
  if (lienzo) {
    lienzo.fillStyle="rgb(0,0,0)";
    lienzo.fillRect(0,0,300,300);
    var fecha=new Date();
    var cad=fecha.getDay()+"/"+fecha.getMonth()+"/"+fecha.getFullYear();
    lienzo.font="bold 30px Arial";
    lienzo.fillStyle="rgb(255,0,0)";
    var anchoTexto=lienzo.measureText(cad).width;
    lienzo.textAlign="center";
    lienzo.fillText(cad,150,50);
  }
}

</script>

</head>
<body onLoad="dibujar()">
<canvas id="lienzo1" width="300" height="300">
Su navegador no permite utilizar canvas.
</canvas>
</body>
</html>
